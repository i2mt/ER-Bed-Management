<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>مدیریت تخت هوشمند</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --primary: #4f46e5;
      --primary-soft: #eef2ff;
      --danger: #e11d48;
      --danger-soft: #fff1f2;
      --success: #059669;
      --success-soft: #ecfdf5;
      --warning: #d97706;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #e2e8f0;
      --text-1: #0f172a;
      --text-2: #475569;
      --text-3: #94a3b8;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --radius-card: 20px;
      --radius-btn: 12px;
      --radius-pill: 100px;
    }

    body.dark {
      --bg: #0b1120;
      --surface: #151f32;
      --surface-2: #1e2d45;
      --border: #1e2d45;
      --text-1: #f1f5f9;
      --text-2: #94a3b8;
      --text-3: #475569;
      --primary: #818cf8;
      --primary-soft: #1e1b4b;
      --danger: #fb7185;
      --danger-soft: #2d0a14;
      --success: #34d399;
      --success-soft: #022c22;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Vazirmatn', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100dvh;
      transition: background 0.2s, color 0.2s;
    }

    .app {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 12px 32px;
    }

    /* ── Top bar (header + shift + toolbar all in one strip) ── */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 2px 8px;
      margin-bottom: 10px;
    }

    .header-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text-1);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .stat-pills {
      display: flex;
      gap: 5px;
      flex: 1;
    }
    .stat-pill {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-size: 0.68rem;
      font-weight: 700;
      border: 1.5px solid;
    }
    .stat-pill.empty  { background: var(--success-soft); color: var(--success); border-color: color-mix(in srgb, var(--success) 30%, transparent); }
    .stat-pill.occ    { background: var(--danger-soft);  color: var(--danger);  border-color: color-mix(in srgb, var(--danger) 30%, transparent); }

    /* shift action icon buttons — always visible in top bar */
    .shift-icons { display: flex; gap: 5px; }

    .icon-btn {
      width: 34px; height: 34px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--text-2);
      font-size: 0.82rem;
      transition: 0.15s;
      flex-shrink: 0;
    }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn.primary { background: var(--primary); color: white; border-color: var(--primary); }
    .icon-btn.danger  { background: var(--danger-soft); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, transparent); }

    /* ── Shift card — only shown when a shift action is active ── */
    .shift-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-card);
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
      display: none;
    }
    .shift-card.open { display: block; }

    .shift-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 10px;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.76rem;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: 0.12s;
      width: 100%;
    }
    .shift-btn:active { transform: scale(0.96); }
    .shift-btn.send {
      background: var(--primary);
      color: white;
    }
    .shift-btn.receive-scan,
    .shift-btn.receive-paste {
      background: var(--surface-2);
      color: var(--text-1);
      border-color: var(--border);
    }

    /* QR display */
    .qr-panel {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1.5px solid var(--border);
    }
    .qr-panel.open { display: block; }

    .qr-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #qrcode canvas, #qrcode img {
      border-radius: 16px;
      background: white;
      padding: 14px;
      box-shadow: var(--shadow-md);
      display: block;
    }

    .qr-hint {
      font-size: 0.68rem;
      color: var(--text-2);
      text-align: center;
      line-height: 1.6;
    }

    .qr-foot {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .qr-foot .shift-btn { flex: 1; }

    /* scanner */
    .scanner-panel {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1.5px solid var(--border);
    }
    .scanner-panel.open { display: block; }

    #reader { border-radius: 14px; overflow: hidden; }

    .scanner-status {
      font-size: 0.68rem;
      color: var(--text-2);
      margin-top: 6px;
      padding: 6px 10px;
      background: var(--surface-2);
      border-radius: 10px;
      direction: ltr;
      text-align: left;
      min-height: 30px;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 6px;
    }

    .filters {
      display: flex;
      gap: 3px;
      background: var(--surface);
      padding: 3px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--border);
    }

    .filter-btn {
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-family: inherit;
      font-size: 0.67rem;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      border: none;
      color: var(--text-2);
      transition: 0.15s;
      white-space: nowrap;
    }
    .filter-btn.active { background: var(--primary); color: white; }

    .toolbar-actions { display: flex; gap: 5px; }

    .tool-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 0.67rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      transition: 0.12s;
      white-space: nowrap;
    }
    .tool-btn:active { transform: scale(0.95); }
    .tool-btn.danger {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 30%, transparent);
      background: var(--danger-soft);
    }

    /* ── Bed rows ── */
    .bed-section {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-card);
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
    }

    .section-header {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-2);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-mini-stats {
      display: flex;
      gap: 6px;
      font-size: 0.65rem;
      font-weight: 600;
    }
    .mini-occ { color: var(--danger); }
    .mini-emp { color: var(--success); }

    .beds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
      gap: 8px;
    }

    .bed-card {
      border-radius: 14px;
      padding: 10px 4px 8px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      border: 2px solid transparent;
      position: relative;
    }
    .bed-card:active { transform: scale(0.93); }

    .bed-card.empty {
      background: var(--success-soft);
      border-color: color-mix(in srgb, var(--success) 25%, transparent);
    }
    .bed-card.occupied {
      background: var(--danger-soft);
      border-color: color-mix(in srgb, var(--danger) 25%, transparent);
    }

    .bed-num {
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1;
      color: var(--text-1);
    }
    .bed-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      margin: 5px auto 0;
    }
    .empty .bed-dot   { background: var(--success); }
    .occupied .bed-dot { background: var(--danger); }

    /* ── Footer ── */
    .footer {
      text-align: center;
      font-size: 0.6rem;
      color: var(--text-3);
      margin-top: 20px;
      line-height: 1.8;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      left: 50%;
      transform: translateX(-50%) translateY(0);
      background: var(--text-1);
      color: var(--bg);
      padding: 8px 18px;
      border-radius: var(--radius-pill);
      font-size: 0.72rem;
      font-weight: 600;
      z-index: 9999;
      white-space: nowrap;
      pointer-events: none;
      animation: toastAnim 2s ease forwards;
    }
    @keyframes toastAnim {
      0%   { opacity: 0; transform: translateX(-50%) translateY(8px); }
      15%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      70%  { opacity: 1; }
      100% { opacity: 0; }
    }

    @media (max-width: 420px) {
      .beds-grid { grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px; }
      .header-title { font-size: 0.88rem; }
      .shift-btn.send { font-size: 0.76rem; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Top bar: title + stats + shift icons + dark mode -->
  <div class="top-bar">
    <div class="header-title">🛏️ تخت</div>
    <div class="stat-pills">
      <div class="stat-pill empty"><i class="fas fa-circle" style="font-size:0.45rem"></i> <span id="emptyCount">0</span></div>
      <div class="stat-pill occ"><i class="fas fa-circle" style="font-size:0.45rem"></i> <span id="occupiedCount">0</span></div>
    </div>
    <div class="shift-icons">
      <button class="icon-btn primary" id="sendQrBtn" title="تولید QR"><i class="fas fa-qrcode"></i></button>
      <button class="icon-btn" id="receiveScanBtn" title="اسکن QR"><i class="fas fa-camera"></i></button>
      <button class="icon-btn" id="receivePasteBtn" title="چسباندن کد"><i class="fas fa-paste"></i></button>
    </div>
    <button class="icon-btn" id="darkModeBtn" title="تغییر تم"><i class="fas fa-moon"></i></button>
  </div>

  <!-- Shift card — expands only when needed -->
  <div class="shift-card" id="shiftCard">
    <!-- QR display panel -->
    <div class="qr-panel" id="qrPanel">
      <div class="qr-inner">
        <div id="qrcode"></div>
        <p class="qr-hint">دستگاه مقابل این QR را اسکن کند.<br>اگر اسکن ممکن نیست کد متنی را کپی کنید.</p>
        <div class="qr-foot">
          <button class="shift-btn receive-paste" id="copyTextBtn"><i class="fas fa-copy"></i> کپی کد</button>
          <button class="shift-btn receive-paste" id="hideQrBtn"><i class="fas fa-times"></i> بستن</button>
        </div>
      </div>
    </div>

    <!-- Scanner panel -->
    <div class="scanner-panel" id="scannerPanel">
      <div id="reader"></div>
      <div class="scanner-status" id="scanStatus">🔍 دوربین در حال راه‌اندازی...</div>
      <button class="shift-btn receive-paste" id="stopScanBtn" style="margin-top:8px">
        <i class="fas fa-times"></i> لغو اسکن
      </button>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="filters">
      <button class="filter-btn active" id="filterAll">همه</button>
      <button class="filter-btn" id="filterEmpty">🟢 خالی</button>
      <button class="filter-btn" id="filterOccupied">🔴 اشغال</button>
    </div>
    <div class="toolbar-actions">
      <button class="tool-btn" id="undoBtn"><i class="fas fa-undo-alt"></i> برگشت</button>
      <button class="tool-btn danger" id="clearAllBtn"><i class="fas fa-trash-alt"></i></button>
    </div>
  </div>

  <!-- Beds -->
  <div id="rowsContainer"></div>

  <div class="footer">
    روی هر تخت ضربه بزنید → پذیرش / ترخیص<br>
    Designed by Mohammad Mahdi Taghavi
  </div>
</div>

<script>
// ── Config ──
const TOTAL = 42;
const STORE = 'sbed_v2';
const ROWS = [
  { label: "ردیف اول", start: 1,  end: 14 },
  { label: "ردیف دوم", start: 15, end: 28 },
  { label: "ردیف سوم", start: 29, end: 42 },
];

// ── State ──
let beds = new Array(TOTAL).fill(false);
let history = [];
let filter = 'all';

// ── Bitmask encode/decode ──
// 42 booleans → 6 bytes (48 bits, last 6 padding 0) → base64 ~8 chars
function encode(arr) {
  const bytes = [];
  for (let i = 0; i < TOTAL; i += 8) {
    let byte = 0;
    for (let b = 0; b < 8; b++) {
      if (arr[i + b]) byte |= (1 << (7 - b));
    }
    bytes.push(byte);
  }
  // btoa from byte array
  return btoa(String.fromCharCode(...bytes));
}

function decode(str) {
  try {
    const raw = atob(str);
    const arr = new Array(TOTAL).fill(false);
    for (let i = 0; i < TOTAL; i++) {
      const byteIdx = Math.floor(i / 8);
      const bitIdx  = 7 - (i % 8);
      arr[i] = !!(raw.charCodeAt(byteIdx) & (1 << bitIdx));
    }
    return arr;
  } catch { return null; }
}

// ── Persist ──
function save() { localStorage.setItem(STORE, JSON.stringify(beds)); }
function load() {
  try {
    const s = localStorage.getItem(STORE);
    if (s) {
      const p = JSON.parse(s);
      if (Array.isArray(p) && p.length === TOTAL) { beds = p; return; }
    }
  } catch {}
  // demo data
  [1,3,5,8,12,16,19,22,25,30,34,37,40,42].forEach(n => { beds[n-1] = true; });
}
function saveHistory() { localStorage.setItem(STORE + '_h', JSON.stringify(history)); }
function loadHistory() {
  try {
    const s = localStorage.getItem(STORE + '_h');
    if (s) history = JSON.parse(s);
  } catch {}
}

// ── History ──
function pushHistory() {
  history.push(beds.slice());
  if (history.length > 15) history.shift();
  saveHistory();
}
function undo() {
  if (!history.length) { toast("هیچ عملی برای بازگشت نیست"); return; }
  beds = history.pop().slice();
  save(); saveHistory(); render();
  toast("↩️ بازگشت به وضعیت قبل");
}

// ── Toggle ──
function toggle(idx) {
  pushHistory();
  beds[idx] = !beds[idx];
  save(); render();
  toast(beds[idx] ? `➕ تخت ${idx+1} پذیرش` : `✅ تخت ${idx+1} ترخیص`);
}

// ── Render ──
function render() {
  const occ = beds.filter(Boolean).length;
  document.getElementById('occupiedCount').textContent = occ;
  document.getElementById('emptyCount').textContent = TOTAL - occ;

  let html = '';
  for (const row of ROWS) {
    let visible = [];
    for (let n = row.start; n <= row.end; n++) {
      const idx = n - 1;
      const isOcc = beds[idx];
      if (filter === 'empty'    && isOcc)  continue;
      if (filter === 'occupied' && !isOcc) continue;
      visible.push({ n, idx, isOcc });
    }
    if (!visible.length) continue;

    const rowOcc = beds.slice(row.start-1, row.end).filter(Boolean).length;
    const rowEmp = (row.end - row.start + 1) - rowOcc;

    html += `<div class="bed-section">
      <div class="section-header">
        <span>${row.label}</span>
        <div class="section-mini-stats">
          <span class="mini-occ"><i class="fas fa-circle" style="font-size:0.45rem"></i> ${rowOcc}</span>
          <span class="mini-emp"><i class="fas fa-circle" style="font-size:0.45rem"></i> ${rowEmp}</span>
        </div>
      </div>
      <div class="beds-grid">`;

    for (const b of visible) {
      html += `<div class="bed-card ${b.isOcc ? 'occupied' : 'empty'}" data-idx="${b.idx}">
        <div class="bed-num">${b.n}</div>
        <div class="bed-dot"></div>
      </div>`;
    }
    html += `</div></div>`;
  }
  document.getElementById('rowsContainer').innerHTML = html;
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(f === 'all' ? 'filterAll' : f === 'empty' ? 'filterEmpty' : 'filterOccupied').classList.add('active');
  render();
}

// ── Toast ──
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

// ── Dark mode ──
function toggleDark() {
  document.body.classList.toggle('dark');
  const on = document.body.classList.contains('dark');
  document.getElementById('darkModeBtn').innerHTML = `<i class="fas fa-${on ? 'sun' : 'moon'}"></i>`;
  localStorage.setItem('dark', on);
}

// ── QR Send ──
let _scanner = null;

function showQR() {
  closeScannerPanel();
  const encoded = encode(beds);
  const qrDiv = document.getElementById('qrcode');
  qrDiv.innerHTML = '';
  // Tiny payload → use L correction for maximum readability
  new QRCode(qrDiv, {
    text: encoded,
    width: 240,
    height: 240,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.L,
  });
  document.getElementById('qrPanel').classList.add('open');
  toast("QR آماده — دستگاه مقابل اسکن کند");
}

function hideQR() {
  document.getElementById('qrPanel').classList.remove('open');
}

function copyText() {
  const encoded = encode(beds);
  navigator.clipboard.writeText(encoded)
    .then(() => toast("📋 کد کپی شد — در دستگاه مقابل 'چسباندن' بزنید"))
    .catch(() => toast("کپی ناموفق بود"));
}

async function pasteText() {
  try {
    const text = (await navigator.clipboard.readText()).trim();
    const arr = decode(text);
    if (!arr) throw new Error();
    pushHistory();
    beds = arr;
    save(); render();
    toast("✅ وضعیت تخت‌ها دریافت شد");
  } catch {
    toast("کد معتبری در کلیپ‌بورد نیست");
  }
}

// ── QR Scan ──
function startScanner() {
  hideQR();
  document.getElementById('scannerPanel').classList.add('open');
  const status = document.getElementById('scanStatus');
  status.textContent = '🔍 دوربین در حال راه‌اندازی...';
  document.getElementById('reader').innerHTML = '';

  const scanner = new Html5Qrcode('reader');
  _scanner = scanner;

  scanner.start(
    { facingMode: 'environment' },
    { fps: 12, qrbox: { width: 260, height: 260 } },
    (text) => {
      status.textContent = '✅ کد خوانده شد';
      const arr = decode(text.trim());
      if (arr) {
        pushHistory();
        beds = arr;
        save(); render();
        toast("✅ وضعیت تخت‌ها از QR دریافت شد");
        stopScanner();
      } else {
        status.textContent = '❌ QR نامعتبر است — دوباره تلاش کنید';
      }
    },
    (err) => { /* silent scan errors */ }
  ).catch(err => {
    status.textContent = `❌ دسترسی به دوربین ممکن نیست`;
    toast("دسترسی به دوربین ممکن نیست");
  });
}

function stopScanner() {
  if (_scanner) { _scanner.stop().catch(()=>{}); _scanner = null; }
  closeScannerPanel();
}

function closeScannerPanel() {
  document.getElementById('scannerPanel').classList.remove('open');
}

// ── Clear all ──
function clearAll() {
  if (!confirm("همه تخت‌ها خالی می‌شوند. ادامه؟")) return;
  pushHistory();
  beds.fill(false);
  save(); render();
  toast("همه تخت‌ها تخلیه شدند");
}

// ── Init ──
function init() {
  load();
  loadHistory();
  render();

  // bed click delegation
  document.getElementById('rowsContainer').addEventListener('click', e => {
    const card = e.target.closest('.bed-card');
    if (!card) return;
    toggle(+card.dataset.idx);
  });

  document.getElementById('darkModeBtn').onclick  = toggleDark;
  document.getElementById('sendQrBtn').onclick    = showQR;
  document.getElementById('receiveScanBtn').onclick = startScanner;
  document.getElementById('receivePasteBtn').onclick = pasteText;
  document.getElementById('copyTextBtn').onclick  = copyText;
  document.getElementById('hideQrBtn').onclick    = hideQR;
  document.getElementById('stopScanBtn').onclick  = stopScanner;
  document.getElementById('undoBtn').onclick      = undo;
  document.getElementById('clearAllBtn').onclick  = clearAll;
  document.getElementById('filterAll').onclick      = () => setFilter('all');
  document.getElementById('filterEmpty').onclick    = () => setFilter('empty');
  document.getElementById('filterOccupied').onclick = () => setFilter('occupied');

  if (localStorage.getItem('dark') === 'true') toggleDark();
}

init();
</script>
</body>
</html>
