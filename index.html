<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>مدیریت تخت اورژانس | FoxiBed</title>
  <!-- QR & WebRTC -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --gradient-success: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --gradient-danger: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      --gradient-dark: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
      --primary: #667eea;
      --primary-dark: #5a67d8;
      --primary-light: rgba(102, 126, 234, 0.15);
      --danger: #ff6b6b;
      --success: #4cd964;
      --warning: #ffa726;
      --bg-primary: #f8fafc;
      --surface: #ffffff;
      --surface-elevated: #f1f5f9;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --text-tertiary: #94a3b8;
      --border: #e2e8f0;
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --radius-md: 1rem;
      --radius-lg: 1.25rem;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.dark {
      --bg-primary: #111827;
      --surface: #1f2937;
      --surface-elevated: #374151;
      --text-primary: #f9fafb;
      --text-secondary: #d1d5db;
      --text-tertiary: #9ca3af;
      --border: #374151;
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      --primary: #60a5fa;
    }

    body {
      font-family: 'Vazirmatn', system-ui, 'Segoe UI', 'Roboto', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 0 12px 24px;
      transition: background 0.2s, color 0.2s;
    }

    .app-container {
      max-width: 700px;
      margin: 0 auto;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px 0 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: var(--gradient-primary);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }
    .stats {
      display: flex;
      gap: 12px;
      background: var(--surface);
      padding: 6px 14px;
      border-radius: 60px;
      font-size: 0.8rem;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .stats span { display: flex; align-items: center; gap: 5px; }

    /* action row */
    .action-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      justify-content: center;
    }
    .btn {
      border: none;
      background: var(--surface);
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: inherit;
    }
    .btn-primary { background: var(--gradient-primary); color: white; border: none; }
    .btn-danger { background: var(--gradient-danger); color: white; border: none; }
    .btn-icon { background: var(--surface-elevated); }
    .btn:active { transform: scale(0.96); }

    /* sync card */
    .sync-card {
      background: var(--surface);
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    .sync-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-tertiary);
      margin-bottom: 12px;
    }
    .sync-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .qr-area { text-align: center; margin-top: 12px; }
    #qrcode img, #qrcode canvas { max-width: 140px; background: white; border-radius: 16px; padding: 8px; }
    #webrtcStatus { font-size: 0.7rem; margin-top: 8px; color: var(--primary); }

    /* filter bar */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .filter-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 6px 16px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-secondary);
    }
    .filter-btn.active {
      background: var(--gradient-primary);
      border-color: transparent;
      color: white;
    }
    .clear-btn {
      background: var(--gradient-danger);
      border: none;
      padding: 6px 20px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 600;
      color: white;
      cursor: pointer;
    }

    /* bed rows */
    .bed-row {
      background: var(--surface);
      border-radius: 28px;
      padding: 16px 12px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    .row-header {
      padding: 0 8px 12px;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: baseline;
      gap: 10px;
      border-right: 3px solid var(--primary);
      margin-right: 4px;
    }
    .beds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
      gap: 12px;
    }
    .bed-card {
      background: var(--surface-elevated);
      border-radius: 20px;
      padding: 12px 6px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      border-top: 3px solid;
      box-shadow: var(--shadow-sm);
    }
    .bed-card.occupied { background: rgba(255, 107, 107, 0.1); border-top-color: var(--danger); }
    .bed-card.empty { background: rgba(76, 217, 100, 0.1); border-top-color: var(--success); }
    .bed-card:active { transform: scale(0.96); }
    .bed-number { font-size: 1.2rem; font-weight: 800; }
    .bed-status {
      font-size: 0.6rem;
      font-weight: 700;
      margin-top: 6px;
      padding: 3px 8px;
      border-radius: 30px;
      display: inline-block;
    }
    .occupied .bed-status { background: rgba(255, 107, 107, 0.2); color: var(--danger); }
    .empty .bed-status { background: rgba(76, 217, 100, 0.2); color: var(--success); }

    .footer-note {
      text-align: center;
      font-size: 0.65rem;
      color: var(--text-tertiary);
      margin-top: 20px;
      padding: 8px;
      border-top: 1px solid var(--border);
    }
    .credit {
      text-align: center;
      font-size: 0.6rem;
      color: var(--text-tertiary);
      margin-top: 10px;
      direction: ltr;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: white;
      padding: 8px 20px;
      border-radius: 60px;
      font-size: 0.75rem;
      z-index: 1000;
      animation: fadeOut 2s ease forwards;
      pointer-events: none;
    }
    @keyframes fadeOut {
      0% { opacity: 1; transform: translateX(-50%) translateY(0); }
      70% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-10px); visibility: hidden; }
    }
    @media (max-width: 480px) {
      .beds-grid { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; }
      .btn { padding: 6px 12px; font-size: 0.7rem; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <!-- Header -->
  <div class="header">
    <h1>🛏️ FoxiBed | مدیریت تخت</h1>
    <div class="stats">
      <span>🟢 <span id="emptyCount">0</span></span>
      <span>🔴 <span id="occupiedCount">0</span></span>
    </div>
  </div>

  <!-- Action row: Dark mode + Undo -->
  <div class="action-row">
    <button id="darkModeBtn" class="btn btn-icon"><i class="fas fa-moon"></i> حالت شب</button>
    <button id="undoBtn" class="btn btn-icon"><i class="fas fa-undo-alt"></i> واگرد</button>
  </div>

  <!-- Sync card for shift handoff (WebRTC + QR) -->
  <div class="sync-card">
    <div class="sync-title">📲 تحویل شیفت بین دو دستگاه</div>
    <div class="sync-buttons">
      <button id="sendSyncBtn" class="btn btn-primary"><i class="fas fa-qrcode"></i> ارسال وضعیت (QR)</button>
      <button id="receiveSyncBtn" class="btn btn-icon"><i class="fas fa-camera"></i> دریافت وضعیت (اسکن)</button>
      <button id="cancelSyncBtn" class="btn btn-icon" style="display: none;"><i class="fas fa-times"></i> لغو</button>
    </div>
    <div id="qrDisplayArea" class="qr-area" style="display: none;">
      <div id="qrcode"></div>
      <button id="hideQrBtn" class="btn btn-icon" style="margin-top: 8px;">✖️ بستن</button>
    </div>
    <div id="scannerArea" style="display: none; margin-top: 10px;">
      <div id="reader" class="scanner-container" style="border-radius: 16px; overflow: hidden;"></div>
      <button id="stopScanBtn" class="btn btn-icon" style="margin-top: 8px;">❌ لغو اسکن</button>
    </div>
    <div id="webrtcStatus" style="font-size: 0.7rem; margin-top: 8px;"></div>
  </div>

  <!-- Filter + Clear all -->
  <div class="filter-bar">
    <div class="filter-group">
      <button id="filterAll" class="filter-btn active">همه</button>
      <button id="filterEmpty" class="filter-btn">🟢 فقط خالی</button>
      <button id="filterOccupied" class="filter-btn">🔴 فقط اشغال</button>
    </div>
    <button id="clearAllBtn" class="clear-btn"><i class="fas fa-trash-alt"></i> همه تخلیه</button>
  </div>

  <!-- Beds container -->
  <div id="rowsContainer"></div>

  <div class="footer-note">
    ✅ روی هر تخت ضربه بزنید → پذیرش / ترخیص · دکمه واگرد برای بازگشت · فیلتر برای نمایش خالی/اشغال
  </div>
  <div class="credit">Designed and developed by Mohammad Mahdi Taghavi</div>
</div>

<script>
  // ---------- STATE & HISTORY ----------
  const STORAGE_KEY = 'foxibed_state';
  const TOTAL_BEDS = 42;
  let bedsOccupied = new Array(TOTAL_BEDS).fill(false);
  let historyStack = [];
  let currentFilter = 'all';
  
  const ROWS = [
    { name: "🩺 ردیف اول (۱-۱۴)", start: 1, end: 14 },
    { name: "🩺 ردیف دوم (۱۵-۲۸)", start: 15, end: 28 },
    { name: "🩺 ردیف سوم (۲۹-۴۲)", start: 29, end: 42 }
  ];
  
  function pushToHistory() {
    const snapshot = bedsOccupied.slice();
    historyStack.push(snapshot);
    if (historyStack.length > 10) historyStack.shift();
    localStorage.setItem(STORAGE_KEY + '_history', JSON.stringify(historyStack));
  }
  
  function undo() {
    if (historyStack.length === 0) { showToast("هیچ عملی برای بازگشت وجود ندارد"); return; }
    const previous = historyStack.pop();
    bedsOccupied = previous.slice();
    persistState();
    renderFiltered();
    showToast("↩️ واگرد انجام شد", 1200);
    localStorage.setItem(STORAGE_KEY + '_history', JSON.stringify(historyStack));
  }
  
  function persistState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(bedsOccupied));
  }
  
  function loadState() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length === TOTAL_BEDS) bedsOccupied = parsed;
      } catch(e) {}
    }
    if (bedsOccupied.every(v=>v===false)) {
      const demo = [1,3,5,8,12,16,19,22,25,30,34,37,40,42];
      demo.forEach(b => { if(b>=1 && b<=TOTAL_BEDS) bedsOccupied[b-1] = true; });
    }
    const savedHistory = localStorage.getItem(STORAGE_KEY + '_history');
    if (savedHistory) {
      try { historyStack = JSON.parse(savedHistory); } catch(e) { historyStack = []; }
    } else {
      historyStack = [];
      pushToHistory();
    }
  }
  
  function updateCounters() {
    const occ = bedsOccupied.filter(v=>v).length;
    document.getElementById('emptyCount').innerText = TOTAL_BEDS-occ;
    document.getElementById('occupiedCount').innerText = occ;
  }
  
  function showToast(msg, duration=1800) {
    const old = document.querySelector('.toast');
    if (old) old.remove();
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), duration);
  }
  
  function toggleBed(index) {
    if (index<0 || index>=TOTAL_BEDS) return;
    pushToHistory();
    bedsOccupied[index] = !bedsOccupied[index];
    persistState();
    renderFiltered();
    const bedNum = index+1;
    showToast(bedsOccupied[index] ? `➕ تخت ${bedNum} پذیرش شد` : `✅ تخت ${bedNum} ترخیص شد`);
  }
  
  function renderFiltered() {
    const container = document.getElementById('rowsContainer');
    if (!container) return;
    let html = '';
    for (const row of ROWS) {
      const { name, start, end } = row;
      let bedsInRow = [];
      for (let b=start; b<=end; b++) {
        const idx = b-1;
        const occ = bedsOccupied[idx];
        let visible = true;
        if (currentFilter === 'empty' && occ === true) visible = false;
        if (currentFilter === 'occupied' && occ === false) visible = false;
        if (visible) bedsInRow.push({num:b, idx, occ});
      }
      if (bedsInRow.length === 0) continue;
      html += `<div class="bed-row"><div class="row-header"><span>${name}</span></div><div class="beds-grid">`;
      for (let bed of bedsInRow) {
        const cls = bed.occ ? "occupied" : "empty";
        const statusText = bed.occ ? "اشغال" : "خالی";
        html += `<div class="bed-card ${cls}" data-bed-idx="${bed.idx}">
          <div class="bed-number">${bed.num}</div>
          <div class="bed-status">${statusText}</div>
        </div>`;
      }
      html += `</div></div>`;
    }
    container.innerHTML = html;
    updateCounters();
  }
  
  function setFilter(filter) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    if (filter === 'all') document.getElementById('filterAll').classList.add('active');
    if (filter === 'empty') document.getElementById('filterEmpty').classList.add('active');
    if (filter === 'occupied') document.getElementById('filterOccupied').classList.add('active');
    renderFiltered();
  }
  
  function toggleDarkMode() {
    document.body.classList.toggle('dark');
    const btn = document.getElementById('darkModeBtn');
    btn.innerHTML = document.body.classList.contains('dark') ? "<i class='fas fa-sun'></i> حالت روز" : "<i class='fas fa-moon'></i> حالت شب";
    localStorage.setItem('darkMode', document.body.classList.contains('dark'));
  }
  
  // ---------- WEBRTC PEER-TO-PEER ----------
  let peerConnection = null, dataChannel = null;
  const webrtcStatusDiv = document.getElementById('webrtcStatus');
  const configuration = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
  
  async function initiateSend() {
    if (peerConnection) { showToast("همگام‌سازی فعال است، لغو کنید"); return; }
    webrtcStatusDiv.innerText = "🔵 در حال آماده‌سازی اتصال...";
    peerConnection = new RTCPeerConnection(configuration);
    dataChannel = peerConnection.createDataChannel("bedsync");
    setupDataChannelEvents(dataChannel);
    
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    await new Promise(resolve => {
      if (peerConnection.iceGatheringState === 'complete') resolve();
      else peerConnection.onicegatheringstatechange = () => {
        if (peerConnection.iceGatheringState === 'complete') resolve();
      };
    });
    const sdpString = JSON.stringify({ type: peerConnection.localDescription.type, sdp: peerConnection.localDescription.sdp });
    displayQR(sdpString, "ارسال");
    document.getElementById('cancelSyncBtn').style.display = "inline-flex";
  }
  
  function setupDataChannelEvents(channel) {
    channel.onopen = () => {
      webrtcStatusDiv.innerText = "✅ متصل! ارسال وضعیت فعلی...";
      channel.send(JSON.stringify({ beds: bedsOccupied.slice() }));
    };
    channel.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.beds && Array.isArray(data.beds) && data.beds.length === TOTAL_BEDS) {
          pushToHistory();
          bedsOccupied = data.beds.slice();
          persistState();
          renderFiltered();
          showToast("🔄 وضعیت از دستگاه دیگر دریافت شد", 2000);
          closeWebRTC();
        } else showToast("داده نامعتبر");
      } catch(e) { showToast("خطا در دریافت داده"); }
    };
    channel.onclose = () => { webrtcStatusDiv.innerText = "❌ اتصال بسته شد"; closeWebRTC(); };
    channel.onerror = () => { webrtcStatusDiv.innerText = "خطا در ارتباط"; closeWebRTC(); };
  }
  
  async function initiateReceive() {
    if (peerConnection) { showToast("لطفاً همگام‌سازی جاری را لغو کنید"); return; }
    webrtcStatusDiv.innerText = "🟢 آماده اسکن QR از دستگاه دیگر...";
    document.getElementById('scannerArea').style.display = "block";
    document.getElementById('qrDisplayArea').style.display = "none";
    const readerDiv = document.getElementById('reader');
    readerDiv.innerHTML = "";
    const html5Scanner = new Html5Qrcode("reader");
    const onSuccess = async (decodedText) => {
      try {
        const data = JSON.parse(decodedText);
        if (data.type && data.sdp && data.type === "offer") {
          await html5Scanner.stop();
          document.getElementById('scannerArea').style.display = "none";
          webrtcStatusDiv.innerText = "🟣 در حال اتصال...";
          peerConnection = new RTCPeerConnection(configuration);
          peerConnection.ondatachannel = (event) => {
            dataChannel = event.channel;
            setupDataChannelEvents(dataChannel);
          };
          await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: data.type, sdp: data.sdp }));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          await new Promise(resolve => {
            if (peerConnection.iceGatheringState === 'complete') resolve();
            else peerConnection.onicegatheringstatechange = () => {
              if (peerConnection.iceGatheringState === 'complete') resolve();
            };
          });
          const answerSdp = JSON.stringify({ type: peerConnection.localDescription.type, sdp: peerConnection.localDescription.sdp });
          displayQR(answerSdp, "پاسخ");
          document.getElementById('cancelSyncBtn').style.display = "inline-flex";
        } else {
          showToast("QR نامعتبر: باید از دکمه ارسال دستگاه دیگر گرفته شود");
          await html5Scanner.stop();
          document.getElementById('scannerArea').style.display = "none";
        }
      } catch(e) { showToast("QR نامعتبر"); await html5Scanner.stop(); document.getElementById('scannerArea').style.display = "none"; }
    };
    await html5Scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onSuccess);
    window._activeScanner = html5Scanner;
    document.getElementById('stopScanBtn').onclick = () => { html5Scanner.stop(); document.getElementById('scannerArea').style.display = "none"; };
  }
  
  function displayQR(dataStr, label) {
    const qrDiv = document.getElementById('qrcode');
    qrDiv.innerHTML = "";
    new QRCode(qrDiv, { text: dataStr, width: 140, height: 140 });
    document.getElementById('qrDisplayArea').style.display = "block";
    document.getElementById('scannerArea').style.display = "none";
    webrtcStatusDiv.innerText = `📷 کد ${label} ساخته شد. دستگاه دیگر آن را اسکن کند.`;
  }
  
  function closeWebRTC() {
    if (dataChannel) dataChannel.close();
    if (peerConnection) peerConnection.close();
    peerConnection = null; dataChannel = null;
    document.getElementById('cancelSyncBtn').style.display = "none";
    document.getElementById('qrDisplayArea').style.display = "none";
    document.getElementById('scannerArea').style.display = "none";
    webrtcStatusDiv.innerText = "";
    if (window._activeScanner) {
      window._activeScanner.stop().catch(e=>console.log);
      window._activeScanner = null;
    }
  }
  
  function cancelSync() { closeWebRTC(); showToast("همگام‌سازی لغو شد"); }
  
  function setAllEmpty() {
    if (confirm("همه تخت‌ها خالی می‌شوند. ادامه؟")) {
      pushToHistory();
      bedsOccupied.fill(false);
      persistState();
      renderFiltered();
      showToast("همه تخت‌ها تخلیه شدند");
    }
  }
  
  // event delegation for bed taps
  function attachBedEvents() {
    document.body.addEventListener('click', (e) => {
      const card = e.target.closest('.bed-card');
      if (!card) return;
      const idx = card.getAttribute('data-bed-idx');
      if (idx !== null) toggleBed(parseInt(idx,10));
    });
  }
  
  function init() {
    loadState();
    renderFiltered();
    attachBedEvents();
    // UI buttons
    document.getElementById('undoBtn').onclick = undo;
    document.getElementById('darkModeBtn').onclick = toggleDarkMode;
    document.getElementById('sendSyncBtn').onclick = initiateSend;
    document.getElementById('receiveSyncBtn').onclick = initiateReceive;
    document.getElementById('clearAllBtn').onclick = setAllEmpty;
    document.getElementById('filterAll').onclick = () => setFilter('all');
    document.getElementById('filterEmpty').onclick = () => setFilter('empty');
    document.getElementById('filterOccupied').onclick = () => setFilter('occupied');
    document.getElementById('hideQrBtn').onclick = () => { document.getElementById('qrDisplayArea').style.display = "none"; closeWebRTC(); };
    document.getElementById('cancelSyncBtn').onclick = cancelSync;
    document.getElementById('stopScanBtn').onclick = () => { if(window._activeScanner) window._activeScanner.stop(); document.getElementById('scannerArea').style.display = "none"; };
    if (localStorage.getItem('darkMode') === 'true') toggleDarkMode();
  }
  init();
</script>
